<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M-Pesa STK Push</title>
<style>
body{font-family:Arial;background:#f1f5f2;display:grid;place-items:center;min-height:100vh;margin:0;padding:15px;box-sizing:border-box}
main{background:white;padding:25px;border-radius:16px;width:100%;max-width:380px;box-sizing:border-box}
h1{color:#16834a}label{display:block;margin-top:18px}
input,button{width:100%;padding:14px;margin-top:8px;box-sizing:border-box;border-radius:9px;font-size:16px}
input{border:1px solid #ccc}button{background:#16834a;color:white;border:0;font-weight:bold}
#status{white-space:pre-wrap;margin-top:18px}
</style>
</head>
<body>
<main>
<h1>M-PESA</h1>
<h2>Pay with M-Pesa</h2>
<form id="form">
<label>Phone number</label>
<input id="phone" placeholder="2547XXXXXXXX" pattern="254[17][0-9]{8}" maxlength="12" required>
<label>Amount (KES)</label>
<input id="amount" type="number" min="1" step="1" value="1" required>
<button id="pay">Send STK Push</button>
</form>
<div id="status">Ready for sandbox testing.</div>
</main>
<script>
document.getElementById('form').onsubmit=async e=>{
e.preventDefault();
const b=document.getElementById('pay'),s=document.getElementById('status');
b.disabled=true;s.textContent='Sending request...';
try{
const r=await fetch('pay.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:document.getElementById('phone').value,amount:document.getElementById('amount').value})});
const d=await r.json();s.textContent=d.message||JSON.stringify(d);
}catch(e){s.textContent='Request failed. Check the server.'}
b.disabled=false;
};
</script>
</body>
</html>
